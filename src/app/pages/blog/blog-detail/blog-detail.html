@if (article(); as post) {
  <article class="py-16 w-full mx-auto container px-4 sm:px-6 lg:max-w-3xl md:max-w-2xl">

    <!-- Back button -->
    <a routerLink="/blog"
       class="inline-flex items-center gap-1.5 text-sm text-zinc-500 dark:text-zinc-400 hover:text-yellow-500 dark:hover:text-yellow-400 transition mb-8 group">
      <svg xmlns="http://www.w3.org/2000/svg" class="size-4 transition group-hover:-translate-x-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
      </svg>
      Volver a Artículos
    </a>

    <!-- Header -->
    <header class="mb-8">
      <div class="flex items-center gap-2 mb-3">
        <span class="text-xs font-mono px-2 py-0.5 rounded-full bg-yellow-100 dark:bg-yellow-500/10 text-yellow-700 dark:text-yellow-300 border border-yellow-200 dark:border-yellow-500/20">
          {{ post.tag }}
        </span>
        <time class="text-xs text-zinc-400 dark:text-zinc-500">{{ post.date }}</time>
      </div>
      <h1 class="text-2xl sm:text-3xl font-semibold text-black/80 dark:text-white leading-snug">
        {{ post.title }}
      </h1>
      <p class="mt-3 text-base text-zinc-600 dark:text-zinc-400">
        {{ post.summary }}
      </p>
    </header>

    <hr class="border-zinc-200 dark:border-zinc-700/50 mb-8">

    <!-- Content -->
    <div class="prose prose-zinc dark:prose-invert prose-sm sm:prose-base max-w-none
                prose-headings:font-semibold prose-headings:text-black/80 dark:prose-headings:text-white
                prose-a:text-yellow-500 prose-a:no-underline hover:prose-a:underline
                prose-strong:text-black/80 dark:prose-strong:text-white
                prose-code:text-yellow-600 dark:prose-code:text-yellow-300
                prose-pre:bg-zinc-900 prose-pre:border prose-pre:border-zinc-700"
         [innerHTML]="post.content">
    </div>

    <!-- External link -->
    @if (post.url) {
      <div class="mt-10 pt-6 border-t border-zinc-200 dark:border-zinc-700/50">
        <a [href]="post.url" target="_blank" rel="noopener noreferrer"
           class="inline-flex items-center gap-2 text-sm font-medium text-yellow-500 dark:text-yellow-400 hover:underline">
          Ver artículo completo en Dev.to
          <svg xmlns="http://www.w3.org/2000/svg" class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
          </svg>
        </a>
      </div>
    }

  </article>
}
